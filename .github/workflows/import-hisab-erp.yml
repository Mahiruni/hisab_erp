name: Import Hisab ERP archive

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-hisab-erp.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-hisab-erp
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=/tmp/erp_hisabtech-complete.zip
          FILE_ID=1j3VHcq-j-Kg9bOWfsqxoZys62gbtA6wo
          rm -f "$ARCHIVE"

          echo "Downloading archive through Googleusercontent..."
          if ! curl --fail --location \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t" \
            --output "$ARCHIVE"; then
            echo "Direct download failed; trying gdown fallback..."
            rm -f "$ARCHIVE"
            python -m pip install --quiet --disable-pip-version-check --upgrade gdown
            gdown "https://drive.google.com/uc?id=${FILE_ID}" -O "$ARCHIVE"
          fi

          test -s "$ARCHIVE"
          ls -lh "$ARCHIVE"
          file "$ARCHIVE"
          unzip -tq "$ARCHIVE"
          echo "cc0108484cfb5343693885d0a704ec345551d40745743575b35cf1738eaef5dc  $ARCHIVE" | sha256sum --check

      - name: Extract project into repository root
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=/tmp/erp_hisabtech-complete.zip
          DEST=/tmp/hisab-import
          SOURCE="$DEST/erp_hisabtech"

          rm -rf "$DEST"
          mkdir -p "$DEST"
          unzip -q "$ARCHIVE" -d "$DEST"
          test -f "$SOURCE/package.json"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$SOURCE"/. .
          test -f package.json
          echo "Extracted $(find . -type f ! -path './.git/*' | wc -l) files."

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Import complete Hisab ERP project"
          git push origin HEAD:main
